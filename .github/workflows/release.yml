name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.2.0-alpha.1)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: myr-app

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate tag and workspace version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '${tag}' must match v<semver>."
            exit 1
          fi

          version="$(awk '
            /^\[workspace\.package\]$/ { in_section=1; next }
            /^\[/ { in_section=0 }
            in_section && $1=="version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"

          if [[ -z "${version}" ]]; then
            echo "Could not read [workspace.package].version from Cargo.toml."
            exit 1
          fi

          if [[ "v${version}" != "${tag}" ]]; then
            echo "Tag '${tag}' does not match workspace version 'v${version}'."
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build-artifacts:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            archive_ext: tar.gz
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            archive_ext: tar.gz
            rust_target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            platform: macos-x86_64
            archive_ext: tar.gz
            rust_target: x86_64-apple-darwin
          - os: macos-15
            platform: macos-aarch64
            archive_ext: tar.gz
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
            archive_ext: zip
            rust_target: x86_64-pc-windows-msvc
    env:
      ARCHIVE_ROOT: myr-app-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
      ARCHIVE_NAME: myr-app-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.${{ matrix.archive_ext }}
      BUILD_DIR: target/${{ matrix.rust_target }}/release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release -p myr-app --bin myr-app --target ${{ matrix.rust_target }}

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${ARCHIVE_ROOT}"
          cp "${BUILD_DIR}/${BIN_NAME}" "dist/${ARCHIVE_ROOT}/${BIN_NAME}"
          cp README.md LICENSE "dist/${ARCHIVE_ROOT}/"
          tar -czf "${ARCHIVE_NAME}" -C dist "${ARCHIVE_ROOT}"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "dist/$env:ARCHIVE_ROOT" | Out-Null
          Copy-Item "$env:BUILD_DIR/$env:BIN_NAME.exe" "dist/$env:ARCHIVE_ROOT/$env:BIN_NAME.exe"
          Copy-Item "README.md","LICENSE" "dist/$env:ARCHIVE_ROOT/"
          Compress-Archive -Path "dist/$env:ARCHIVE_ROOT/*" -DestinationPath "$env:ARCHIVE_NAME" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  build-gui-linux:
    name: Build GUI (linux-x86_64)
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      GUI_VERSION: ${{ needs.prepare.outputs.version }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Build myr-gui
        run: cargo build --locked --release -p myr-gui-app --bin myr-gui

      - name: Download verified linuxdeploy
        shell: bash
        run: scripts/download-linuxdeploy.sh

      - name: Package GUI artifacts
        shell: bash
        run: |
          scripts/package-gui-linux.sh \
            "${GUI_VERSION}" \
            target/release/myr-gui \
            tools/linuxdeploy-x86_64.AppImage \
            dist/release

      - name: Verify GUI artifacts
        shell: bash
        run: scripts/verify-gui-linux-package.sh "${GUI_VERSION}" dist/release

      - name: Upload GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-gui-linux-x86_64
          path: |
            dist/release/myr-gui-${{ needs.prepare.outputs.version }}-linux-x86_64.AppImage
            dist/release/myr-gui-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-artifacts
      - build-gui-linux
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          files=( *.tar.gz *.zip *.AppImage )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release archives found."
            exit 1
          fi
          LC_ALL=C sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: myr ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/SHA256SUMS.txt
