name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -config-file .github/actionlint.yaml

  quality:
    name: Quality (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

  coverage-gate:
    name: Coverage gate (llvm-cov)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # The shared application migration ratchet is now active.
      # Raise this to 85% before creating the alpha tag.
      COVERAGE_MIN_LINES: "80"
      MYR_DB_PASSWORD: root
      MYR_TEST_DB_HOST: 127.0.0.1
      MYR_TEST_DB_PORT: "3306"
      MYR_TEST_DB_USER: root
      MYR_TEST_DB_DATABASE: myr_bench
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Seed integration dataset
        run: |
          cargo run -p myr-app --bin benchmark -- \
            --host 127.0.0.1 \
            --port 3306 \
            --user root \
            --database mysql \
            --sql "CREATE DATABASE IF NOT EXISTS myr_bench"
          cargo run -p myr-app --bin benchmark -- \
            --host 127.0.0.1 \
            --port 3306 \
            --user root \
            --database myr_bench \
            --seed-rows 200 \
            --sql "SELECT id FROM events ORDER BY id LIMIT 20"

      - name: Collect unit coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features --no-report

      - name: Add MySQL adapter integration coverage
        env:
          MYR_RUN_MYSQL_INTEGRATION: "1"
        run: |
          cargo llvm-cov --no-report \
            -p myr-adapters --test mysql_integration

      - name: Add TUI MySQL integration coverage
        env:
          MYR_RUN_TUI_MYSQL_INTEGRATION: "1"
        run: |
          cargo llvm-cov test --no-report \
            -p myr-tui mysql_query_path_streams_rows_when_enabled

      - name: Add CLI MySQL integration coverage
        run: |
          mkdir -p target/coverage
          cargo llvm-cov run --no-report -p myr-app --bin myr-app -- \
            query --host 127.0.0.1 --port 3306 --user root \
            --database myr_bench --typed-values \
            --sql "SELECT id, category FROM events ORDER BY id LIMIT 20"
          cargo llvm-cov run --no-report -p myr-app --bin myr-app -- \
            export --host 127.0.0.1 --port 3306 --user root \
            --database myr_bench --typed-values \
            --format jsonl --output target/coverage/cli-export.jsonl \
            --sql "SELECT id, category FROM events ORDER BY id LIMIT 20"
          cargo llvm-cov run --no-report -p myr-app --bin myr-app -- \
            doctor --host 127.0.0.1 --port 3306 --user root \
            --database myr_bench
          cargo llvm-cov run --no-report -p myr-app --bin benchmark -- \
            --host 127.0.0.1 --port 3306 --user root \
            --database myr_bench \
            --sql "SELECT id, category FROM events ORDER BY id LIMIT 20" \
            --metrics-label "ci-coverage" \
            --metrics-output target/coverage/benchmark.json
          test -s target/coverage/cli-export.jsonl
          test -s target/coverage/benchmark.json

      - name: Generate coverage summary and enforce threshold
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report \
            --json --summary-only \
            --output-path target/coverage/summary.json \
            --fail-under-lines "$COVERAGE_MIN_LINES"
          cargo llvm-cov report \
            | tee target/coverage/summary.txt

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-${{ github.run_id }}
          path: target/coverage/
          if-no-files-found: warn

  perf-smoke:
    name: Perf smoke (MySQL benchmark)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: myr_bench
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYR_DB_PASSWORD: root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run benchmark smoke check
        run: |
          mkdir -p target/perf
          cargo run -p myr-app --bin benchmark -- \
            --host 127.0.0.1 \
            --port 3306 \
            --user root \
            --database myr_bench \
            --seed-rows 10000 \
            --sql "SELECT id, user_id, category, payload, created_at FROM events ORDER BY id LIMIT 10000" \
            --assert-first-row-ms 5000 \
            --assert-min-rows-per-sec 500 \
            --trend-policy bench/perf-trend-policy.json \
            --metrics-label "ci-perf-smoke" \
            --metrics-output target/perf/perf-smoke.json

      - name: Upload perf trend artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-${{ github.run_id }}
          path: target/perf/perf-smoke.json

  tui-mysql-integration:
    name: TUI MySQL integration (gated)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYR_DB_PASSWORD: root
      MYR_RUN_TUI_MYSQL_INTEGRATION: "1"
      MYR_TEST_DB_HOST: 127.0.0.1
      MYR_TEST_DB_PORT: "3306"
      MYR_TEST_DB_USER: root
      MYR_TEST_DB_DATABASE: myr_bench
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Seed integration dataset
        run: |
          cargo run -p myr-app --bin benchmark -- \
            --host 127.0.0.1 \
            --port 3306 \
            --user root \
            --database mysql \
            --sql "CREATE DATABASE IF NOT EXISTS myr_bench"
          cargo run -p myr-app --bin benchmark -- \
            --host 127.0.0.1 \
            --port 3306 \
            --user root \
            --database myr_bench \
            --seed-rows 200 \
            --sql "SELECT id, user_id, category, payload, created_at FROM events ORDER BY id LIMIT 20"

      - name: Run gated TUI integration test
        run: cargo test -p myr-tui mysql_query_path_streams_rows_when_enabled -- --nocapture

  mariadb-integration:
    name: MariaDB integration (adapters)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent || mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYR_DB_PASSWORD: root
      MYR_RUN_MYSQL_INTEGRATION: "1"
      MYR_TEST_DB_HOST: 127.0.0.1
      MYR_TEST_DB_PORT: "3306"
      MYR_TEST_DB_USER: root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run adapter integration test suite on MariaDB
        run: cargo test -p myr-adapters --test mysql_integration -- --nocapture

  cross-platform:
    name: Cross-platform validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build workspace
        run: cargo build --workspace --all-features --locked

      - name: Run optional keyring smoke check
        if: ${{ vars.MYR_CI_RUN_KEYRING_SMOKE == '1' }}
        env:
          MYR_RUN_KEYRING_SMOKE: "1"
        run: cargo test -p myr-adapters keyring_password_round_trip_when_enabled -- --nocapture
